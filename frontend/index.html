<!DOCTYPE html>
<html lang="sl" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dnevni šolski jedilnik - OŠ Trbovlje</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#13283A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Šolski Jedilnik">
    <link rel="apple-touch-icon" href="school-logo.png">
    <link rel="icon" type="image/png" href="school-logo.png">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tomato: '#FF6B6B',
                        carrot: '#FF9F43',
                        salad: '#7ED321',
                        sky: '#74B9FF',
                        apple: '#FF4757',
                        leaf: '#2ED573'
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="styles.css?v=20260604-tooltipfix">
    <script src="app.js?v=20260604-tooltipfix" defer></script>
</head>

<body class="app-body min-h-screen overflow-x-hidden">
    <main class="app-shell">
        <header class="app-header">
            <div class="brand-lockup">
                <div class="brand-mark" aria-hidden="true">J</div>
                <div>
                    <p class="brand-kicker">OŠ Trbovlje</p>
                    <h1>Jedilnik</h1>
                </div>
            </div>
        </header>

        <section class="today-panel" aria-labelledby="todayTitle">
            <div class="today-copy">
                <p class="today-label" id="dayContext">Danes</p>
                <h2 id="todayTitle"><span id="currentDay"></span></h2>
                <a href="https://ostrbovlje.si/prehrana/" id="menuLink" target="_blank" rel="noopener noreferrer">
                    <span id="menuDateRange">Nalagam jedilnik...</span>
                </a>
            </div>
            <div class="weekday-strip" aria-label="Šolski teden">
                <button type="button" data-weekday="1">Pon</button>
                <button type="button" data-weekday="2">Tor</button>
                <button type="button" data-weekday="3">Sre</button>
                <button type="button" data-weekday="4">Čet</button>
                <button type="button" data-weekday="5">Pet</button>
            </div>
        </section>

        <section class="loading-panel hidden" id="loading" aria-live="polite">
            <div class="loading-plate" aria-hidden="true"></div>
            <div class="loading-lines">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p>Pridobivam svež jedilnik...</p>
        </section>

        <section id="menuContent" class="menu-stack" aria-live="polite"></section>

        <section id="allergenInfo" class="allergen-note">
            <div class="note-icon" aria-hidden="true">Aa</div>
            <div>
                <h2>Kaj pomenijo črke?</h2>
                <p>To so alergeni. Dotakni se oznake pri jedi, če te zanima več.</p>
            </div>
        </section>

        <footer class="app-footer">
            <div>
                <p class="credit-label">Aplikacijo je ustvaril</p>
                <p class="credit-name">Andraž Jevševar · 5.b</p>
            </div>
            <button class="feedback-button" id="feedbackBtn" type="button">
                Povratne informacije
            </button>
        </footer>

        <div class="update-row">
            <span>Zadnja posodobitev</span>
            <strong id="lastUpdate"></strong>
        </div>
    </main>
</body>

</html>
